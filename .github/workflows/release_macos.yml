name: Release Helper for macOS on GitHub / AWS

on:
  workflow_dispatch:
    inputs:
      assemble_as_prerelease:
        description: 'Create the GitHub release as a prerelease, so that releases/latest keeps answering the previous version while this version is assembled; the caller then publishes it (gh release edit <tag> --prerelease=false --latest). release_all.sh passes true once it carries that publish step. Default: the release is the latest as soon as it is created, as before.'
        type: boolean
        default: false

# Auto cancel previous runs if they were not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Write permissions are required to upload the release asset.
permissions: write-all

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    env:
      EDAMAME_HELPER_SENTRY: ${{ secrets.EDAMAME_HELPER_SENTRY }}
      PWNED_API_KEY: ${{ secrets.PWNED_API_KEY }}
      EDAMAME_TARGET: ${{ secrets.EDAMAME_TARGET }}
      EDAMAME_SERVER: ${{ secrets.EDAMAME_SERVER }}
      EDAMAME_SERVER_PEM: ${{ secrets.EDAMAME_SERVER_PEM }}
      EDAMAME_SERVER_KEY: ${{ secrets.EDAMAME_SERVER_KEY }}
      EDAMAME_CA_PEM: ${{ secrets.EDAMAME_CA_PEM }}
      EDAMAME_CLIENT_PEM: ${{ secrets.EDAMAME_CLIENT_PEM }}
      EDAMAME_CLIENT_KEY: ${{ secrets.EDAMAME_CLIENT_KEY }}
      EDAMAME_CLIENT_CA_PEM: ${{ secrets.EDAMAME_CLIENT_CA_PEM }}
      LAMBDA_SIGNATURE: ${{ secrets.LAMBDA_SIGNATURE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:

      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          auto_remediate: true
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-macos-latest
          # The release lookup and upload (gh) and the Homebrew tap clone and
          # push (DEV_GITHUB_TOKEN) come after the action, and the org IP allow
          # list refuses them until the Hub lists this hosted runner. This
          # repository is public and answers the default probe at once, which
          # proves nothing: probe a private repository with a token that can
          # read it.
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          checkout: true
          persist_credentials: false
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: "60"
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}
      - name: Install additional packages w/ Homebrew
        run: |
          brew install protobuf
          brew install wget

      - name: Setup signing
        shell: bash
        run: |
          # The keys, certificates, .p12 bundles and the App Store Connect key
          # only feed the keychain and the notarytool profile: they live in an
          # owner-only directory outside the workspace and the OS temp roots,
          # removed when this step ends, so no later step (or the EDAMAME
          # Posture gate's content scan) finds secret material on disk next
          # to the job's GitHub traffic (FP-CI-23).
          umask 077
          SIGNING_DIR=$(mktemp -d "$RUNNER_TEMP/signing.XXXXXX")
          trap 'rm -rf "$SIGNING_DIR"' EXIT
          cd "$SIGNING_DIR"

          # Create certificate files from secrets base64
          echo ${{ secrets.APPLE_DEVELOPMENT_CER }} | base64 --decode > certificate_dev.cer
          echo ${{ secrets.APPLE_DEVELOPMENT_KEY }} | base64 --decode > certificate_dev.key
          echo ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CER }} | base64 --decode > certificate_installer.cer
          echo ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_KEY }} | base64 --decode > certificate_installer.key
          echo ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CER }} | base64 --decode > certificate_application.cer
          echo ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_KEY }} | base64 --decode > certificate_application.key
          
          # Create p12 file
          openssl pkcs12 -export -name zup -in certificate_dev.cer -inkey certificate_dev.key -passin pass:${{ secrets.APPLE_P12_PASSWORD }} -out certificate_dev.p12 -passout pass:${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          openssl pkcs12 -export -name zup -in certificate_installer.cer -inkey certificate_installer.key -passin pass:${{ secrets.APPLE_P12_PASSWORD }} -out certificate_installer.p12 -passout pass:${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          openssl pkcs12 -export -name zup -in certificate_application.cer -inkey certificate_application.key -passin pass:${{ secrets.APPLE_P12_PASSWORD }} -out certificate_application.p12 -passout pass:${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          
          # Configure Keychain
          KEYCHAIN_PATH=/tmp/app-signing.keychain-db
          security create-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          
          # Import certificates on Keychain
          security import certificate_dev.p12 -P "${{ secrets.APPLE_P12_PASSWORD }}" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security import certificate_installer.p12 -P "${{ secrets.APPLE_P12_PASSWORD }}" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security import certificate_application.p12 -P "${{ secrets.APPLE_P12_PASSWORD }}" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Verify Keychain
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Store notarization credentials
          echo ${{ secrets.APPLE_APPSTORE_CONNECT_API_KEY }} | base64 --decode > appstore_connect_api_key.p8
          xcrun notarytool store-credentials -k appstore_connect_api_key.p8 -d ${{ secrets.APPLE_APPSTORE_CONNECT_API_KEY_ID }} -i ${{ secrets.APPLE_APPSTORE_CONNECT_API_ISSUER_ID }} Edamame

      - name: Decode ES provisioning profile
        shell: bash
        run: |
          # Owner-only, outside the OS temp roots; removed after packaging.
          umask 077
          PROFILE_DIR=$(mktemp -d "$RUNNER_TEMP/profile.XXXXXX")
          echo "${{ secrets.APPLE_ES_HELPER_PROVISIONING_PROFILE }}" | base64 --decode > "$PROFILE_DIR/EDAMAME_Helper.provisionprofile"
          echo "ES_PROVISIONING_PROFILE=$PROFILE_DIR/EDAMAME_Helper.provisionprofile" >> "$GITHUB_ENV"

      - name: Build helper and its standalone installer
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/edamame_helper \
            target/x86_64-apple-darwin/release/edamame_helper \
            target/aarch64-apple-darwin/release/edamame_helper

      - name: Packaging and signing of the Helper
        shell: bash
        run: |
          ./macos/make-pkg.sh --provisioning-profile "$ES_PROVISIONING_PROFILE" && ./macos/make-distribution-pkg.sh
          rm -rf "$(dirname "$ES_PROVISIONING_PROFILE")"

      # notarization.sh staples the ticket into edamame-helper.pkg (and fails
      # on any verdict but Accepted). The versioned copy is the file that is
      # published (S3, the GitHub release, the Homebrew cask), so it is taken
      # only after stapling; taken before, as it was, it shipped without the
      # ticket.
      - name: Notarization
        shell: bash
        run: |
          set -euo pipefail
          ./macos/notarization.sh ./target/pkg/edamame-helper.pkg
          VERSION=$(grep '^version =' ./Cargo.toml | awk '{print $3}' | tr -d '"')
          # Final naming with version
          cp ./target/pkg/edamame-helper.pkg "./target/pkg/edamame-helper-macos-${VERSION}.pkg"
          xcrun stapler validate "./target/pkg/edamame-helper-macos-${VERSION}.pkg"

      # Signed build provenance (Sigstore, GitHub artifact attestations).
      # Verify a download with:
      #   gh attestation verify <file> --repo edamametechnologies/edamame_helper
      - name: Attest build provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./target/pkg/edamame-helper-macos-*.pkg

      # Main only
      # Check if release exists
      - name: Check for existing release
        if: github.ref == 'refs/heads/main'
        id: get_release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version =' ./Cargo.toml | awk '{print $3}' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          VERSION_TAG=v${VERSION}
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          # Only a definite 404 means "no release yet". Any other failure (the
          # org IP allow list, an expired token, a 5xx) fails the step: an
          # empty `gh release view` output used to read as "no release".
          if RELEASE="$(gh api "repos/${REPO}/releases/tags/${VERSION_TAG}" --jq '"\(.id) \(.upload_url)"' 2>&1)"; then
            read -r RELEASE_ID UPLOAD_URL <<<"$RELEASE"
            if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ && "$UPLOAD_URL" == https://uploads.github.com/* ]]; then
              echo "ERROR: unexpected answer looking up release ${VERSION_TAG} of ${REPO}: ${RELEASE}" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "upload_url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE" == *"HTTP 404"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: looking up release ${VERSION_TAG} of ${REPO} failed: ${RELEASE}" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      # Update the tag if it exists and points to a different commit
      - name: Update the tag if it exists and points to a different commit
        if: github.ref == 'refs/heads/main' && steps.get_release.outputs.exists == 'true'
        run: |
          gh release edit ${{ steps.get_release.outputs.tag }} --repo ${{ github.repository }} --target ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Main only
      # With the `assemble_as_prerelease` input the release is created as a
      # prerelease: several workflows assemble one version, and the public
      # releases/latest redirect, which every installer resolves, must not
      # point at it before all its assets and SHA256SUMS exist. The caller
      # (edamame_app/release_all.sh) then publishes it with
      #   gh release edit <tag> --prerelease=false --latest
      # Without the input (the default, and a manual run) the release is the
      # latest as soon as it is created, as before. A release that already
      # exists keeps its flag: no step passes --prerelease or --latest to it.
      - name: Create release if it doesn't exist
        if: github.ref == 'refs/heads/main' && steps.get_release.outputs.exists != 'true'
        # This populates steps.get_release.outputs.upload_url with the upload_url of the release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_release.outputs.tag }}
          release_name: Release ${{ steps.get_release.outputs.tag }}
          draft: false
          prerelease: ${{ inputs.assemble_as_prerelease }}

      # Main only - a published release's assets are IMMUTABLE (same guard as
      # edamame_cli's release_others.yml, "Check whether the release already
      # carries this asset").
      #
      # The upload below used to replace the asset on every run
      # (`overwrite: true`), and the S3 copy with it. The .pkg is not
      # bit-reproducible (build, signature, notarization ticket), so a re-run
      # of this workflow put different bytes under a name whose digest
      # SHA256SUMS had already recorded.
      #
      # An asset the release already carries is kept and its upload skipped;
      # S3 then receives the published .pkg (see "Fetch the published .pkg
      # from the release"). To genuinely replace a bad asset, delete it from
      # the release (or bump the version): an explicit act, not a side effect
      # of a re-run.
      - name: Check whether the release already carries this asset
        if: github.ref == 'refs/heads/main'
        id: asset_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_release.outputs.version }}"
          TAG="${{ steps.get_release.outputs.tag }}"
          ASSET_NAME="edamame-helper-macos-${VERSION}.pkg"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

          if [[ "${{ steps.get_release.outputs.exists }}" != "true" ]]; then
            echo "Release ${TAG} is new; asset will be uploaded."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same discipline as `Check for existing release`: never turn a gh
          # failure into "not present", or a transient API error would replace
          # a published asset.
          set +e
          names=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>&1)
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            echo "ERROR: could not list assets of ${TAG} (rc=${rc}):" >&2
            echo "${names}" >&2
            echo "ERROR: refusing to guess -- replacing a published asset breaks pinned checksums." >&2
            exit 1
          fi

          if grep -qxF "${ASSET_NAME}" <<<"${names}"; then
            echo "Asset ${ASSET_NAME} is already published on ${TAG}; keeping the published file."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Asset ${ASSET_NAME} not yet on ${TAG}; will upload."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Main only
      - name: Upload asset to release
        if: github.ref == 'refs/heads/main' && steps.asset_check.outputs.exists != 'true'
        # Supports overwrite
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.get_release.outputs.exists == 'true' && steps.get_release.outputs.upload_url || steps.create_release.outputs.upload_url }}
          asset_path: ./target/pkg/edamame-helper-macos-${{ steps.get_release.outputs.version }}.pkg
          asset_name: edamame-helper-macos-${{ steps.get_release.outputs.version }}.pkg
          asset_content_type: application/octet-stream
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # S3 must serve the bytes the release carries. When the release already
      # had this .pkg (its upload was skipped above), take the published file:
      # the AWS step below uploads it instead of the .pkg this run built.
      - name: Fetch the published .pkg from the release
        if: github.ref == 'refs/heads/main' && steps.asset_check.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.get_release.outputs.tag }}"
          PKG_NAME="${{ steps.asset_check.outputs.asset_name }}"
          PUBLISHED_DIR="${RUNNER_TEMP}/published"
          mkdir -p "$PUBLISHED_DIR"
          rm -f "${PUBLISHED_DIR}/${PKG_NAME}"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$PKG_NAME" --dir "$PUBLISHED_DIR"
          if [[ ! -f "${PUBLISHED_DIR}/${PKG_NAME}" || ! -s "${PUBLISHED_DIR}/${PKG_NAME}" ]]; then
            echo "ERROR: ${PKG_NAME} was not downloaded from release ${TAG}" >&2
            exit 1
          fi
          echo "Fetched the published ${PKG_NAME} (sha256 $(shasum -a 256 "${PUBLISHED_DIR}/${PKG_NAME}" | awk '{print $1}'))"

      # Main only (upload to base folder). The .sha256 sidecar holds the same
      # digest as the GitHub release's signed SHA256SUMS.
      # Runs after the release steps so that S3 serves the bytes the release
      # carries: the .pkg fetched from the release when it was already
      # published there, the one this run built and uploaded otherwise.
      - name: Upload helper to AWS
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION=$(grep '^version =' ./Cargo.toml | awk '{print $3}' | tr -d '"')
          PKG=edamame-helper-macos-${VERSION}.pkg
          PKG_DIR=./target/pkg
          if [[ "${{ steps.asset_check.outputs.exists }}" == "true" ]]; then
            PKG_DIR="${RUNNER_TEMP}/published"
          fi
          if [[ ! -f "$PKG_DIR/$PKG" || ! -s "$PKG_DIR/$PKG" ]]; then
            echo "ERROR: no .pkg to publish at ${PKG_DIR}/${PKG}" >&2
            exit 1
          fi
          (cd "$PKG_DIR" && shasum -a 256 "$PKG" > "$PKG.sha256")
          aws s3 cp "$PKG_DIR/$PKG" s3://edamame-helper/macos/$PKG --acl public-read
          aws s3 cp "$PKG_DIR/$PKG.sha256" s3://edamame-helper/macos/$PKG.sha256 --acl public-read

      # Publish to Homebrew Tap
      - name: Publish to Homebrew Tap
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DEV_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          VERSION=${{ steps.get_release.outputs.version }}

          # Download the release asset to calculate SHA256.
          # The "Upload asset to release" step above uploads the .pkg via
          # the GitHub Releases API, but the public CDN URL we use here can
          # take 15-60s to mirror after the API reports success. Retry up to
          # 6 times with backoff so we don't fail the whole release on a
          # transient mirror lag (observed in run 24944052698: wget exit 8).
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/edamame-helper-macos-${VERSION}.pkg"
          for attempt in 1 2 3 4 5 6; do
            if wget -q "$ASSET_URL"; then
              echo "Downloaded release asset on attempt ${attempt}"
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "ERROR: failed to download $ASSET_URL after 6 attempts"
              exit 1
            fi
            sleep_for=$((attempt * 10))
            echo "wget attempt ${attempt} failed, retrying in ${sleep_for}s..."
            rm -f "edamame-helper-macos-${VERSION}.pkg"
            sleep "${sleep_for}"
          done
          SHA_MACOS=$(sha256sum edamame-helper-macos-${VERSION}.pkg | awk '{print $1}')
          
          # Update Homebrew Cask
          sed -i '' "s|url \".*\"|url \"https://github.com/${{ github.repository }}/releases/download/v#{version}/edamame-helper-macos-#{version}.pkg\"|g" macos/edamame-helper.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${SHA_MACOS}\"|g" macos/edamame-helper.rb
          sed -i '' "s|version \".*\"|version \"${VERSION}\"|g" macos/edamame-helper.rb
          
          # Only run if token is present
          if [ -n "${{ secrets.DEV_GITHUB_TOKEN }}" ]; then
            # Disable credential helper to avoid keychain errors
            export GIT_TERMINAL_PROMPT=0
            git config --global credential.helper ""
            
            git clone https://oauth2:${{ secrets.DEV_GITHUB_TOKEN }}@github.com/edamametechnologies/homebrew-tap.git tap
            mkdir -p tap/Casks
            cp macos/edamame-helper.rb tap/Casks/edamame-helper.rb
            cd tap
            git config user.name "EDAMAME Bot"
            git config user.email "bot@edamame.tech"
            git add .
            # Check if there are changes (or if it's a new repo)
            if [ -z "$(git rev-parse HEAD 2>/dev/null)" ] || ! git diff-index --quiet HEAD 2>/dev/null; then
              git commit -m "Update edamame-helper to ${VERSION}"
              git push origin main
            else
              echo "No changes to commit"
            fi
          else
            # A release on main without the token is a broken publish, not a
            # skip: the tap kept the previous version behind a green run. (The
            # step runs on main only; other branches skip it entirely.)
            echo "ERROR: DEV_GITHUB_TOKEN is not available to this repository; the Homebrew tap was not updated"
            exit 1
          fi

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true
      - name: Slack alert on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: "${{ steps.job_status_check.outcome == 'success' && '[JOB FAILURE]' || '' }}${{ steps.dump_sessions.outcome == 'failure' && '[POSTURE POST JOB FAILURE]' || '' }} Release workflow ${{ github.workflow }} for ${{ github.repository }} on ${{ runner.os }} failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}